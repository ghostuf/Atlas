<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas — Dependency Constellation Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0c0c;
  --sub-alt: #121212;
  --sub: #404040;
  --text: #d3c2c3;
  --caret: #bebebe;
  --main: #b7976a;
  --main-hover: #c1a174;
  --error: #ff4d4f;
  --error-extra: #ff7875;
  --warning: #b7976a;

  --text-muted: #bfbfbf;
  --radius: 8px;
  --radius-sm: 4px;
  --transition: 150ms ease;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  user-select: none;
}
#canvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  cursor: grab;
  touch-action: none;
}
#canvas:active { cursor: grabbing; }

/* Modern iv_spade Observatory Panel */
#hud {
  position: absolute;
  top: 18px;
  left: 18px;
  width: 320px;
  background: var(--sub-alt);
  border: 1px solid var(--sub);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
  z-index: 10;
}
.hud-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.hud-icon {
  font-size: 15px;
  color: var(--main);
}
.hud-title {
  font-family: "Lexend Deca", sans-serif;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--text);
  margin: 0;
}
.hud-meta {
  color: var(--text-muted);
  font-size: 11.5px;
  line-height: 1.45;
  margin-bottom: 12px;
}

/* Search Box */
.search-box {
  position: relative;
  margin-bottom: 12px;
}
#search {
  width: 100%;
  padding: 8px 12px 8px 32px;
  background: var(--bg);
  border: 1px solid var(--sub);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: "Roboto Mono", monospace;
  font-size: 12px;
  caret-color: var(--caret);
  outline: none;
  transition: border-color var(--transition);
}
#search:focus {
  border-color: var(--main);
}
.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  color: var(--sub);
  pointer-events: none;
}

/* Legend */
.legend {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 10px;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--sub);
  font-family: "Lexend Deca", sans-serif;
  font-size: 11.5px;
  color: var(--text-muted);
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 7px;
}
.star-pip {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

/* Package Details */
#stellar-info {
  font-size: 12.5px;
}
.stellar-name {
  font-family: "Roboto Mono", monospace;
  font-weight: 500;
  font-size: 13.5px;
  color: var(--text);
  word-break: break-all;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.stellar-badge {
  font-family: "Roboto Mono", monospace;
  font-size: 10px;
  font-weight: 500;
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  text-transform: lowercase;
}
.badge-root { background: rgba(183, 151, 106, 0.15); color: var(--main); border: 1px solid rgba(183, 151, 106, 0.35); }
.badge-direct { background: rgba(211, 194, 195, 0.15); color: var(--text); border: 1px solid rgba(211, 194, 195, 0.35); }
.badge-trans { background: rgba(64, 64, 64, 0.25); color: #8e8e8e; border: 1px solid var(--sub); }
.badge-hot { background: rgba(157, 123, 125, 0.2); color: var(--error); border: 1px solid rgba(157, 123, 125, 0.4); }

.stellar-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
  color: var(--text-muted);
  font-size: 12px;
}
.stellar-row b {
  color: var(--main);
  font-weight: 500;
}
.hud-hint {
  color: var(--text-muted);
  font-size: 11.5px;
  line-height: 1.5;
  font-style: italic;
  opacity: 0.85;
}

/* Controls */
#controls {
  position: absolute;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 10;
}
.control-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--radius);
  background: var(--sub-alt);
  border: 1px solid var(--sub);
  color: var(--text);
  font-family: "Lexend Deca", sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  cursor: pointer;
  outline: none;
  transition: background var(--transition), color var(--transition), border-color var(--transition);
}
.control-btn:hover {
  background: var(--main);
  color: var(--bg);
  border-color: var(--main);
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="hud">
  <div class="hud-header">
    <span class="hud-icon">✧</span>
    <h1 class="hud-title">constellation map</h1>
  </div>
  <div class="hud-meta" id="hud-meta"></div>

  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input id="search" type="search" placeholder="search package..." autocomplete="off">
  </div>

  <div class="legend">
    <div class="legend-item"><span class="star-pip" style="background:#b7976a;"></span>app root</div>
    <div class="legend-item"><span class="star-pip" style="background:#d3c2c3;"></span>direct dep</div>
    <div class="legend-item"><span class="star-pip" style="background:#404040;"></span>transitive</div>
    <div class="legend-item"><span class="star-pip" style="background:#ff4d4f;"></span>high blast</div>
  </div>

  <div id="stellar-info"></div>
</div>

<div id="controls">
  <button class="control-btn" id="btn-recenter" title="Recenter Observatory on App Root">⊙</button>
  <button class="control-btn" id="btn-zoom-in" title="Zoom In">+</button>
  <button class="control-btn" id="btn-zoom-out" title="Zoom Out">−</button>
</div>

    for (var bIdx = 0; bIdx < placedBoxes.length; bIdx++) {
      var pb = placedBoxes[bIdx];
      if (boxX < pb.x + pb.w && boxX + boxW > pb.x && boxY < pb.y + pb.h && boxY + boxH > pb.y) {
        collides = true;
        break;
      }
    }

    if (collides && item.prio <= 2) {
      textY = m.y - m.r - 9 / view.k;
      boxY = textY - boxH / 2;
      collides = false;
      for (var bIdx = 0; bIdx < placedBoxes.length; bIdx++) {
        var pb = placedBoxes[bIdx];
        if (boxX < pb.x + pb.w && boxX + boxW > pb.x && boxY < pb.y + pb.h && boxY + boxH > pb.y) {
          collides = true;
          break;
        }
      }
    }

    if (collides && item.prio < 2) continue;

    placedBoxes.push({ x: boxX, y: boxY, w: boxW, h: boxH });

    ctx.save();
    ctx.globalAlpha = (dim && !isHot) ? 0.25 : 1.0;

    // Clean background pill in --sub-alt (#121212)
    ctx.fillStyle = 'rgba(18, 18, 18, 0.94)';
    ctx.fillRect(boxX, boxY, boxW, boxH);

    ctx.fillStyle = (idx === sel) ? '#b7976a' : (isHot ? '#b7976a' : (m.root ? '#b7976a' : (m.direct ? '#d3c2c3' : '#a0a0a0')));
    ctx.fillText(m.name, m.x, textY);
    ctx.restore();
  }

  ctx.restore();
}

// ---- User Interactions (Drag, Zoom, Pan, Search) ----
function pick(x, y) {
  var wx = (x - view.x) / view.k;
  var wy = (y - view.y) / view.k;
  for (var i = N - 1; i >= 0; i--) {
    var n = nodes[i];
    var dx = wx - n.x;
    var dy = wy - n.y;
    var r = n.r + 7 / view.k;
    if (dx * dx + dy * dy <= r * r) return i;
  }
  return -1;
}

var drag = -1, pan = false, movedDist = 0, last = { x: 0, y: 0 };

cv.addEventListener('pointerdown', function(e) {
  if (cv.setPointerCapture) cv.setPointerCapture(e.pointerId);
  movedDist = 0;
  last = { x: e.clientX, y: e.clientY };
  var i = pick(e.clientX, e.clientY);
  if (i >= 0) {
    drag = i;
    nodes[i].fixed = true;
  } else {
    pan = true;
  }
  cv.style.cursor = 'grabbing';
});

cv.addEventListener('pointermove', function(e) {
  var dx = e.clientX - last.x;
  var dy = e.clientY - last.y;
  if (drag >= 0) {
    movedDist += Math.abs(dx) + Math.abs(dy);
    nodes[drag].x = (e.clientX - view.x) / view.k;
    nodes[drag].y = (e.clientY - view.y) / view.k;
    alpha = Math.max(alpha, 0.35);
  } else if (pan) {
    movedDist += Math.abs(dx) + Math.abs(dy);
    view.x += dx;
    view.y += dy;
  } else {
    hover = pick(e.clientX, e.clientY);
    cv.style.cursor = hover >= 0 ? 'pointer' : 'grab';
  }
  last = { x: e.clientX, y: e.clientY };
});

function release() {
  if (movedDist < 5) {
    select(drag >= 0 ? drag : -1);
  }
  if (drag >= 0) nodes[drag].fixed = false;
  drag = -1;
  pan = false;
  cv.style.cursor = 'grab';
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);

cv.addEventListener('wheel', function(e) {
  e.preventDefault();
  var k0 = view.k;
  var k = Math.min(8, Math.max(0.04, k0 * Math.exp(-e.deltaY * 0.0016)));
  var wx = (e.clientX - view.x) / k0;
  var wy = (e.clientY - view.y) / k0;
  view.k = k;
  view.x = e.clientX - wx * k;
  view.y = e.clientY - wy * k;
}, { passive: false });

document.getElementById('search').addEventListener('input', function() {
  var q = this.value.trim().toLowerCase();
  if (!q) {
    select(-1);
    return;
  }
  var best = -1;
  for (var i = 0; i < N; i++) {
    if (nodes[i].name.toLowerCase().indexOf(q) >= 0 && (best < 0 || nodes[i].transitive > nodes[best].transitive)) {
      best = i;
    }
  }
  if (best >= 0) {
    select(best);
    view.x = W / 2 - nodes[best].x * view.k;
    view.y = H / 2 - nodes[best].y * view.k;
  }
});

// Controls
document.getElementById('btn-recenter').addEventListener('click', function() {
  fit();
  select(-1);
});
document.getElementById('btn-zoom-in').addEventListener('click', function() {
  var cx = W / 2, cy = H / 2;
  var wx = (cx - view.x) / view.k, wy = (cy - view.y) / view.k;
  view.k = Math.min(8, view.k * 1.35);
  view.x = cx - wx * view.k;
  view.y = cy - wy * view.k;
});
document.getElementById('btn-zoom-out').addEventListener('click', function() {
  var cx = W / 2, cy = H / 2;
  var wx = (cx - view.x) / view.k, wy = (cy - view.y) / view.k;
  view.k = Math.max(0.04, view.k / 1.35);
  view.x = cx - wx * view.k;
  view.y = cy - wy * view.k;
});

function boot() {
  resize();
  generateStarfield();
  for (var s = 0; s < 600; s++) tick();
  fit();
  updateInfo();
  function loop() {
    tick();
    draw();
    window.requestAnimationFrame(loop);
  }
  loop();
}

if (document.readyState === 'complete') {
  setTimeout(boot, 40);
} else {
  window.addEventListener('load', function() { setTimeout(boot, 40); });
}
setTimeout(function() { resize(); fit(); }, 250);
})();
</script>
